<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comment Assistant</title>
  <style>
    :root { --bg:#fafaf7; --fg:#1d1d1b; --muted:#6b6b66; --line:#e2e0d8; --accent:#2f4a3a; --warn:#8a3a2a; }
    @media (prefers-color-scheme: dark) { :root { --bg:#151514; --fg:#ecebe6; --muted:#9a9993; --line:#33322f; --accent:#8fb39c; --warn:#d48a78; } }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 -apple-system, system-ui, sans-serif; }
    nav { display:flex; gap:16px; padding:12px 16px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); }
    nav a { color:var(--fg); text-decoration:none; } nav a:hover { text-decoration:underline; }
    main { max-width:760px; margin:0 auto; padding:16px; }
    .card { border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:16px; }
    .card img { width:100%; max-height:420px; object-fit:contain; border-radius:6px; background:#0001; }
    .meta { color:var(--muted); font-size:13px; }
    .caption { white-space:pre-wrap; max-height:8em; overflow:auto; margin:8px 0; }
    textarea { width:100%; font:inherit; padding:8px; border:1px solid var(--line); border-radius:6px; background:transparent; color:inherit; }
    input, select { font:inherit; padding:6px; border:1px solid var(--line); border-radius:6px; background:transparent; color:inherit; }
    button { font:inherit; padding:7px 12px; border-radius:6px; border:1px solid var(--accent); background:var(--accent); color:var(--bg); cursor:pointer; }
    button.ghost { background:transparent; color:var(--fg); border-color:var(--line); }
    button.warn { background:transparent; color:var(--warn); border-color:var(--warn); }
    .draft { margin:10px 0; } .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:6px; }
    table { width:100%; border-collapse:collapse; } td, th { text-align:left; padding:6px 4px; border-bottom:1px solid var(--line); font-size:14px; }
    .err { color:var(--warn); font-size:12px; }
  </style>
</head>
<body>
  <nav><a href="/">Queue</a><a href="/approved">To post</a><a href="/posted">Posted</a><a href="/sources">Sources</a></nav>
  <main>{% block body %}{% endblock %}</main>
</body>
</html>
