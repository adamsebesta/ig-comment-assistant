# Local stand-in for vLLM on a Karpenter GPU node. CPU-only, so a 3B vision
# model takes tens of seconds per post. Fine for a batch job, which is
# exactly why the pipeline is batch.
# Model pull is a separate step (`make model`) rather than the playground's
# initContainer, so a Pod restart never re-triggers a multi-GB download check.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama
  namespace: ica
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ica
spec:
  replicas: 0  # paused: 7B on CPU inside Docker exhausted host memory (2026-10-14)
  strategy:
    type: Recreate  # RWO volume: the old Pod must release it before the new one mounts it
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          env:
            - name: OLLAMA_KEEP_ALIVE
              value: "30m"
            # One model in memory at a time. Default keeps several resident; with
            # 3B still loaded, loading the 7B pushed the Pod past its limit (OOMKilled).
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "1"
            - name: OLLAMA_NUM_PARALLEL
              value: "1"
          ports:
            - containerPort: 11434
          readinessProbe:
            httpGet:
              path: /
              port: 11434
            periodSeconds: 10
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            # CPU limit: without one, CPU inference takes every core on the node and
            # starves its neighbours. Postgres's 1s readiness probe then timed out
            # (245 times in 49 min), it went unready, and its Service refused
            # connections. 6 of 8 cores leaves room for everything else.
            # 7B vision model + 8k context needs ~9 GiB. Both kind nodes share
            # Docker Desktop's VM (~12 GiB here), so 10Gi is the practical ceiling;
            # give Docker 16 GB if anything else starts getting evicted.
            limits:
              cpu: "6"
              memory: 10Gi
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama
---
# The model runs natively on the Mac (Ollama app, Apple GPU via Metal) instead of
# in this cluster: CPU inference inside Docker's VM took minutes per post and
# exhausted host memory. Docker Desktop can't pass the Apple GPU into containers.
#
# Pods can't resolve Docker Desktop's host.docker.internal name, so this Service
# has NO selector and a hand-written EndpointSlice pointing at the Mac's address
# on Docker's network. Apps still call http://ollama:11434, unchanged: only what
# sits behind the name moved. Same pattern as giving RDS an in-cluster name.
#
# To go back in-cluster: delete the EndpointSlice, restore `selector: {app: ollama}`
# and set the Deployment above to replicas: 1.
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: ica
spec:
  ports:
    - name: http
      port: 11434
      targetPort: 11434
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: ollama-host
  namespace: ica
  labels:
    kubernetes.io/service-name: ollama  # how a slice attaches to its Service
addressType: IPv4
ports:
  - name: http
    port: 11434
    protocol: TCP
endpoints:
  - addresses: ["192.168.65.254"]  # host.docker.internal on Docker Desktop
