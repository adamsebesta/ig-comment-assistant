# Non-secret tunables, read as env vars by every component (envFrom).
# Credentials live in the ica-secrets Secret (`make secrets`), never here.
# Changing a value: edit, `make deploy`, then `kubectl -n ica rollout restart
# deploy/web`. CronJobs pick it up on their next run because each Job is a new
# Pod. A running Deployment's env is fixed at Pod start, unlike ECS where a
# new task definition revision forces the redeploy.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ica-config
  namespace: ica
data:
  # Full name, not "ollama": Ollama rejects Host headers that aren't localhost, an IP or
  # *.local/*.internal (DNS-rebinding protection), and the model now runs on the Mac.
  OLLAMA_URL: "http://ollama.ica.svc.cluster.local:11434"
  OLLAMA_MODEL: "qwen2.5vl:7b"   # 3B answered "incidental" for everything (eval 2026-10-14); 7B caught the clothing-central post
  # Writing model, text-only (scoring needs vision; writing doesn't). qwen3:14b's drafts were
  # clearly better than the 7B's in draft-eval (2026-10-14). Pulled into the Mac's Ollama.
  DRAFT_MODEL: "qwen3:14b"
  LLM_NUM_CTX: "8192"
  IMAGE_MAX_PX: "768"
  GRAPH_VERSION: ""
  MAX_CALLS_PER_RUN: "5"   # measured ~2.8% of hourly budget per call (2026-10-14) => ~36 calls/h; 5 x 4 runs = 20/h (~56%)
  PACE_SECONDS: "10"
  USAGE_CEILING: "75"
  HOT_INTERVAL_MIN: "15"
  NORMAL_INTERVAL_MIN: "360"
  HASHTAG_INTERVAL_MIN: "60"   # freshness matters (first comments sit on top); ~4% budget per hashtag call
  MAX_POST_AGE_HOURS: "48"
  MIN_FOLLOWERS: "2500"           # handle sources only; hashtag results never include the owner
  HASHTAG_MIN_LIKES: "10"         # hashtag posts: likes needed grow with age, capped here...
  HASHTAG_LIKES_PER_HOUR: "6"     # ...so a 20-min-old post needs 2, a 2-hour-old post needs 10
  HASHTAG_MIN_COMMENTS: "2"       # or this many comments
  RELEVANCE_THRESHOLD: "0.6"
  WORKER_BATCH: "30"   # model on the Mac GPU: ~20 s/post incl. drafting, so 30 fits the 30-min schedule
  RETENTION_DAYS: "90"
  TONE_FILE: "/config/tone.md"
